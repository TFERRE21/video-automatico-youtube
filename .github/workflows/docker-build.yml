name: Docker build validation

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "automate-clipping-main-configured.zip"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
      - name: Build application image
        run: |
          docker build --progress=plain -t edgetape:ci .
